<style>
:root{--bg:#f3f4f8;--card:#fff;--text:#13203b;--muted:#5d6a82;--accent:#b8892b;--head:#0f2347;--line:#dde1ea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#141d30;--text:#e8ecf5;--muted:#9aa7c0;--accent:#d9a93f;--head:#14264b;--line:#25324d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#141d30;--text:#e8ecf5;--muted:#9aa7c0;--accent:#d9a93f;--head:#14264b;--line:#25324d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,button,.meta b{font-family:Oswald,"Arial Narrow",Impact,sans-serif;letter-spacing:.04em}
header{background:var(--head);color:#fff;padding:28px 20px;text-align:center;border-bottom:4px solid var(--accent)}
header img{display:block;margin:0 auto 10px;width:130px;height:auto}
header h1{margin:0 0 4px;font-size:1.9rem;text-transform:uppercase}
header p{margin:0;opacity:.85}
main{max-width:1000px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:22px}
.card h2{margin:0 0 8px;font-size:1.15rem}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
button{text-transform:uppercase;background:var(--accent);color:#111;border:0;border-radius:8px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;margin-top:14px}
button:disabled{opacity:.5}
.msg{margin-top:10px;font-size:.9rem;color:var(--muted)}
.msg.err{color:#c0392b}
h2.g{margin:0 0 12px}

  <h1>BCSO Department Photo Contest</h1>
  <p>Submit your best shot and see everyone’s entries.</p>
</header>
<main>
  <section class="card">
    <h2>Submit your photo</h2>
    <label for="nm">Your name or callsign</label>
    <input type="text" id="nm" maxlength="40">
    <label for="cap">Caption (optional)</label>
    <input type="text" id="cap" maxlength="100">
    <label for="fl">Photo</label>
    <input type="file" id="fl" accept="image/*">
    <button id="go">Submit</button>
    <div class="msg" id="st"></div>
  </section>
  <h2 class="g">Gallery <span class="count" id="count"></span></h2>
  <div class="grid" id="grid"></div>
  <p class="msg" id="empty" style="display:none">No photos yet. Be the first to submit.</p>
</main>
<div id="lb"><img alt=""></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAaIY7FGRplk9EoOQxv4y_gd5b3BINjQaQ",
  authDomain: "bcso-photo-contest.firebaseapp.com",
  projectId: "bcso-photo-contest",
  storageBucket: "bcso-photo-contest.firebasestorage.app",
  messagingSenderId: "226509077950",
  appId: "1:226509077950:web:e63ce9255909314c82cdef"
};

const db = getFirestore(initializeApp(firebaseConfig));
const photos = collection(db, "photos");
const $ = id => document.getElementById(id);
const lb = $("lb");
lb.onclick = () => lb.style.display = "none";

function status(t, err){ const s = $("st"); s.textContent = t; s.className = "msg" + (err ? " err" : ""); }

function shrink(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      let scale = Math.min(1, 1280 / Math.max(img.width, img.height));
      let out = "";
      for (let attempt = 0; attempt < 4; attempt++) {
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        let q = 0.85;
        out = c.toDataURL("image/jpeg", q);
        while (out.length > 300000 && q > 0.35) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
        if (out.length <= 300000) break;
        scale *= 0.75;
      }
      URL.revokeObjectURL(url);
      out.length <= 390000 ? res(out) : rej(new Error("too big"));
    };
    img.onerror = () => rej(new Error("bad image"));
    img.src = url;
  });
}

$("go").onclick = async () => {
  const name = $("nm").value.trim(), caption = $("cap").value.trim(), f = $("fl").files[0];
  if (!name) return status("Please enter your name.", true);
  if (!f) return status("Please choose a photo.", true);
  const btn = $("go"); btn.disabled = true; status("Uploading…");
  try {
    const img = await shrink(f);
    await addDoc(photos, { name, caption, img, ts: Date.now() });
    status("Submitted! Your photo is in the gallery.");
    $("fl").value = ""; $("cap").value = "";
  } catch (e) {
    status("Upload failed. Please try again.", true);
  }
  btn.disabled = false;
};

onSnapshot(query(photos, orderBy("ts", "desc")), snap => {
  const grid = $("grid"); grid.innerHTML = "";
  $("count").textContent = snap.size ? "(" + snap.size + ")" : "";
  $("empty").style.display = snap.size ? "none" : "block";
  snap.forEach(d => {
    const x = d.data();
    const el = document.createElement("div"); el.className = "item";
    const im = document.createElement("img");
    im.src = x.img; im.alt = x.caption || ("Photo by " + x.name);
    im.onclick = () => { lb.querySelector("img").src = x.img; lb.style.display = "flex"; };
    const m = document.createElement("div"); m.className = "meta";
    const b = document.createElement("b"); b.textContent = x.name || "Anonymous"; m.appendChild(b);
    if (x.caption) { const s = document.createElement("span"); s.textContent = x.caption; m.appendChild(s); }
    el.appendChild(im); el.appendChild(m); grid.appendChild(el);
  });
}, () => status("Couldn’t load the gallery. Check your connection and refresh.", true));
</script>
</body>
</html>
